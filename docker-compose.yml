# Local PostgreSQL for development: `docker compose up -d db`, then
# DATABASE_URL=postgres://hacknation:hacknation@localhost:5432/hacknation
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hacknation
      POSTGRES_USER: hacknation
      POSTGRES_PASSWORD: hacknation
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hacknation -d hacknation']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
